<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的实时留言板</title>
    <style>
        body { background-color: #f4f4f9; font-family: "Microsoft YaHei", sans-serif; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        textarea { width: 100%; height: 80px; padding: 10px; border: 1px solid #ccc; border-radius: 5px; resize: none; box-sizing: border-box; font-family: inherit; }
        button { width: 100%; padding: 10px; margin-top: 10px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        #messageList { margin-top: 20px; border-top: 1px solid #eee; padding-top: 10px; }
        .msg-item { background: #f9f9f9; padding: 10px; border-radius: 5px; margin-bottom: 10px; border-left: 4px solid #007bff; word-wrap: break-word; }
        .time { font-size: 12px; color: #888; margin-top: 5px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="container">
    <h2>⚡ 实时匿名留言板</h2>
    <textarea id="msgInput" placeholder="写点什么吧..."></textarea>
    <button id="submitBtn">发布留言</button>
    
    <div id="messageList"></div>
</div>

<script>
    const SUPABASE_URL = 'https://ytzfkeyrobjubitfddrt.supabase.co';
    // ⚠️ 千万别漏了这里的旧版长密钥 eyJ...
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl0emZrZXlyb2JqdWJpdGZkZHJ0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM0NzIxMjMsImV4cCI6MjEwOTA0ODEyM30.TQXZdhW7FRnIAwXy_JDg8_4C2o0bYXS6S0GX9_D2hEs';
    
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const input = document.getElementById('msgInput');
    const btn = document.getElementById('submitBtn');
    const list = document.getElementById('messageList');

    // 核心渲染函数：统一生成 HTML 字符串
    function createMessageHTML(msg) {
        const timeStr = new Date(msg.created_at).toLocaleString();
        const name = msg.user_email || '匿名用户'; 
        return `
            <div class="msg-header" style="font-size:12px; color:#007bff; font-weight:bold; margin-bottom:5px;">👤 ${name}</div>
            <div>${msg.content}</div>
            <div class="time">${timeStr}</div>
        `;
    }

    // 1. 加载历史留言（强制降序：最新的在最前）
    async function loadMessages() {
        list.innerHTML = '<div style="text-align:center; color:#888;">加载中...</div>';
        
        const { data, error } = await client
            .from('messages')
            .select('*')
            .order('created_at', { ascending: false }); // ⚠️ 降序，最新的排第一

        if (error) {
            list.innerHTML = '<div style="color:red;">读取失败。</div>';
            return;
        }

        list.innerHTML = ''; 
        if (data.length === 0) {
            list.innerHTML = '<div style="text-align:center; color:#888;">还没有留言，快来抢沙发吧！</div>';
            return;
        }

        // 直接生成一个大字符串，一次性塞进去。这样绝对不会乱！
        let htmlStr = '';
        data.forEach(msg => {
            htmlStr += `<div class="msg-item">${createMessageHTML(msg)}</div>`;
        });
        list.innerHTML = htmlStr;
    }

    // 2. 发布留言
    btn.addEventListener('click', async () => {
        const text = input.value.trim();
        if (!text) return alert("留言不能为空哦！");

        btn.innerText = '发送中...';
        btn.disabled = true;

        const { error } = await client
            .from('messages')
            .insert([{ content: text }]);

        btn.innerText = '发布留言';
        btn.disabled = false;

        if (error) {
            alert("发送失败了: " + error.message);
        } else {
            input.value = ''; 
        }
    });

    // 3. ⚡ 实时订阅
    client.channel('custom-all-channel')
      .on(
        'postgres_changes',
        { event: 'INSERT', schema: 'public', table: 'messages' },
        (payload) => {
            // 如果是新发出来的，直接创建节点插到最前面（prepend）
            const emptyTip = list.querySelector('div[style*="text-align:center"]');
            if (emptyTip) emptyTip.remove();

            const div = document.createElement('div');
            div.className = 'msg-item';
            div.innerHTML = createMessageHTML(payload.new);
            list.prepend(div); // 空降第一名！
        }
      )
      .subscribe();

    // 初始化页面
    loadMessages();
</script>

</body>
</html>
