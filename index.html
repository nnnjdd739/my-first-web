<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的留言板</title>
    <style>
        body { background-color: #f4f4f9; font-family: "Microsoft YaHei", sans-serif; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        textarea { width: 100%; height: 80px; padding: 10px; border: 1px solid #ccc; border-radius: 5px; resize: none; box-sizing: border-box; font-family: inherit; }
        button { width: 100%; padding: 10px; margin-top: 10px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        #messageList { margin-top: 20px; border-top: 1px solid #eee; padding-top: 10px; }
        .msg-item { background: #f9f9f9; padding: 10px; border-radius: 5px; margin-bottom: 10px; border-left: 4px solid #007bff; word-wrap: break-word; }
    </style>
</head>
<body>

<div class="container">
    <h2>📝 我的留言板</h2>
    <textarea id="msgInput" placeholder="写点什么吧..."></textarea>
    <button id="submitBtn">发表留言</button>
    
    <div id="messageList">
        <!-- 留言会显示在这里 -->
    </div>
</div>

<script>
    const input = document.getElementById('msgInput');
    const btn = document.getElementById('submitBtn');
    const list = document.getElementById('messageList');

    // 从浏览器的本地存储读取历史留言（如果没存过，就是空数组）
    let messages = JSON.parse(localStorage.getItem('myMessages')) || [];

    // 渲染留言的函数
    function renderMessages() {
        list.innerHTML = ''; // 先清空列表
        messages.forEach(msg => {
            const div = document.createElement('div');
            div.className = 'msg-item';
            div.innerText = msg;
            list.appendChild(div);
        });
    }

    // 点击按钮发布留言
    btn.addEventListener('click', () => {
        const text = input.value.trim();
        if (text) {
            messages.unshift(text); // 把新留言放到最前面
            localStorage.setItem('myMessages', JSON.stringify(messages)); // 保存到本地
            input.value = ''; // 清空输入框
            renderMessages(); // 重新渲染
        } else {
            alert("留言不能为空哦！");
        }
    });

    // 页面加载时，先渲染一次以前的留言
    renderMessages();
</script>

</body>
</html>
