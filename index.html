<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的云端留言板</title>
    <style>
        body { background-color: #f4f4f9; font-family: "Microsoft YaHei", sans-serif; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        textarea { width: 100%; height: 80px; padding: 10px; border: 1px solid #ccc; border-radius: 5px; resize: none; box-sizing: border-box; font-family: inherit; }
        button { width: 100%; padding: 10px; margin-top: 10px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
        #messageList { margin-top: 20px; border-top: 1px solid #eee; padding-top: 10px; }
        .msg-item { background: #f9f9f9; padding: 10px; border-radius: 5px; margin-bottom: 10px; border-left: 4px solid #007bff; word-wrap: break-word; }
        .time { font-size: 12px; color: #888; margin-top: 5px; }
    </style>
    <!-- 引入 Supabase 的工具包 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="container">
    <h2>☁️ 全球可见留言板</h2>
    <textarea id="msgInput" placeholder="让全世界都看到你的留言..."></textarea>
    <button id="submitBtn">发布留言</button>
    
    <div id="messageList">
        <!-- 留言会显示在这里 -->
    </div>
</div>

<script>
    // 你的专属钥匙已经填好啦！
    const SUPABASE_URL = 'https://ytzfkeyrobjubitfddrt.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_uFnRb5_2pem58m0rCCuWag_ev3SJVsc';
    
    // 初始化连接
    const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const input = document.getElementById('msgInput');
    const btn = document.getElementById('submitBtn');
    const list = document.getElementById('messageList');

    // 1. 从云端读取留言
    async function loadMessages() {
        list.innerHTML = '<div style="text-align:center; color:#888;">加载中...</div>';
        
        const { data, error } = await client
            .from('messages')
            .select('*')
            .order('created_at', { ascending: false });

        if (error) {
            console.error("读取失败:", error);
            list.innerHTML = '<div style="color:red;">读取失败，请检查配置。</div>';
            return;
        }

        list.innerHTML = ''; 
        if (data.length === 0) {
            list.innerHTML = '<div style="text-align:center; color:#888;">还没有留言，快来抢沙发吧！</div>';
            return;
        }

        data.forEach(msg => {
            const div = document.createElement('div');
            div.className = 'msg-item';
            const timeStr = new Date(msg.created_at).toLocaleString();
            div.innerHTML = `<div>${msg.content}</div><div class="time">${timeStr}</div>`;
            list.appendChild(div);
        });
    }

    // 2. 发布新留言到云端
    btn.addEventListener('click', async () => {
        const text = input.value.trim();
        if (!text) return alert("留言不能为空哦！");

        btn.innerText = '发送中...';
        btn.disabled = true;

        const { data, error } = await client
            .from('messages')
            .insert([{ content: text }]);

        btn.innerText = '发布留言';
        btn.disabled = false;

        if (error) {
            console.error("发送失败:", error);
            alert("发送失败了，请按 F12 看看控制台报错。");
        } else {
            input.value = ''; 
            loadMessages(); 
        }
    });

    // 页面一打开，就先去云端拉取一次留言
    loadMessages();
</script>

</body>
</html>
